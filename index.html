<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donat xizmati</title>
<style>
:root{--bg:#0b1220;--card:#111b2e;--line:#1e2b45;--tx:#e8eefc;--mut:#8fa0c0;--ac:#3aa0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:20px;letter-spacing:1px}.logo b{color:var(--ac)}
main{max-width:980px;margin:auto;padding:16px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer}
.card:hover{border-color:var(--ac)}.card h3{margin:0 0 8px}.card span{color:var(--ac);font-size:14px}
.tag{color:var(--mut);font-size:13px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn.s{width:auto;background:var(--card);border:1px solid var(--line);padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.on{display:flex}.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px}
.pk{display:flex;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;background:var(--card)}
.pk.on{border-color:var(--ac);background:#10315a}
.msg{padding:10px;border-radius:10px;margin:8px 0;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:pre-wrap}
.err{border-color:#a33;color:#ffb3b3}.ok{border-color:#2a7;color:#b6f5cf}
#ords .o{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
</style></head><body>
<header><div class="logo">DONAT<b>XIZMATI</b></div><div id="acc"></div></header>
<main>
<input id="q" placeholder="O'yinni qidiring..." oninput="draw()">
<div class="grid" id="grid"></div>
<h3 id="oh" style="display:none">Buyurtmalarim</h3><div id="ords"></div>
</main>
<div id="modal" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>
<script>
let P=[],G=null,K=null,me=null,T=localStorage.t||"",BOT="";
const $=i=>document.getElementById(i),fmt=n=>Number(n).toLocaleString("ru-RU")+" so'm";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(m,u,b){const r=await fetch("/web"+u,{method:m,headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({ok:false,error:"Xato"}));if(r.status===401&&T){T="";localStorage.t="";me=null;acc()}return j}
function draw(){const q=$("q").value.toLowerCase();$("grid").innerHTML=P.filter(g=>g.name.toLowerCase().includes(q)).map(g=>`<div class="card" onclick="openG(${g.game_id})"><h3>${esc(g.name)}</h3><span>${g.packages.length} ta paket →</span></div>`).join("")||'<p class="tag">Hozircha mahsulot yo\'q</p>'}
function acc(){const a=$("acc");if(me){a.innerHTML=`<span class="tag">${esc(me.name||"")}</span> <b>${fmt(me.balance)}</b> <a class="btn s" href="https://t.me/${BOT}" target="_blank">To'ldirish</a>`;$("oh").style.display="block";$("ords").innerHTML=me.orders.map(o=>`<div class="o">#${o.id} ${esc(o.game)} — ${esc(o.pkg)} · <b>${esc(o.status)}</b>${o.code?`<br><code>${esc(o.code)}</code>`:""}</div>`).join("")}else{a.innerHTML="";$("oh").style.display="none";$("ords").innerHTML=""}}
function login(){const s=document.createElement("script");s.src="https://telegram.org/js/telegram-widget.js?22";s.async=true;s.dataset.telegramLogin=BOT;s.dataset.size="medium";s.dataset.onauth="onTg(user)";s.dataset.requestAccess="write";$("sheet").appendChild(s)}
async function onTg(u){const r=await call("POST","/login",u);if(!r.ok)return msg(r.error,1);T=r.token;localStorage.t=T;await loadMe();closeM()}
async function loadMe(){if(!T)return;const r=await call("GET","/me");if(r.ok){me=r;acc()}}
function openM(h){$("sheet").innerHTML=h;$("modal").classList.add("on")}
function closeM(){$("modal").classList.remove("on")}
function msg(t,e){const m=$("m");if(m)m.innerHTML=`<div class="msg ${e?"err":"ok"}">${esc(t)}</div>`}
function openG(id){G=P.find(g=>g.game_id==id);K=null;if(!T)return openM(`<h3>${esc(G.name)}</h3><p class="tag">Sotib olish uchun Telegram orqali kiring (botdagi hisobingiz va balansingiz shu yerda ham ishlaydi).</p><div id="m"></div>`),login();
openM(`<h3>${esc(G.name)}</h3><input id="pid" inputmode="numeric" placeholder="${G.type=="telegram"?"@username":"Player ID"}">${G.needs_server_id?'<input id="sid" inputmode="numeric" placeholder="Server ID">':""}${G.packages.map(p=>`<div class="pk" id="pk${p.id}" onclick="pick(${p.id})"><span>${esc(p.name)}</span><b>${p.in_stock?fmt(p.price):"Tugagan"}</b></div>`).join("")}<div id="m"></div><button class="btn" id="go" onclick="buy()">Sotib olish</button>`)}
function pick(id){K=id;document.querySelectorAll(".pk").forEach(e=>e.classList.toggle("on",e.id=="pk"+id))}
async function buy(){if(!K)return msg("Paketni tanlang",1);const b={package_id:K,player_id:$("pid").value.trim(),server_id:$("sid")?$("sid").value.trim():"",reference:"w"+Date.now()};
$("go").disabled=true;const c=await call("POST","/check",b);if(c.ok&&c.nickname&&!confirm("O'yinchi: "+c.nickname+"\nTo'g'rimi?")){$("go").disabled=false;return}
const r=await call("POST","/order",b);$("go").disabled=false;if(!r.ok)return msg(r.error,1);
msg(r.order.code?"Tayyor! Kodingiz: "+r.order.code:"Buyurtma #"+r.order.id+" qabul qilindi ("+r.order.status+"). Natija botga ham yuboriladi.");loadMe()}
(async()=>{const[c,p]=await Promise.all([fetch("/web/config").then(r=>r.json()),fetch("/web/products").then(r=>r.json())]);BOT=c.bot||"";P=p.products||[];draw();await loadMe()})();
</script></body></html>
